name: test

on:
  push:
  pull_request:

jobs:
  bash:
    name: bash on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run-tests.sh

  powershell:
    name: ${{ matrix.shell }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }   # Windows PowerShell 5.1
          - { os: windows-latest, shell: pwsh }         # PowerShell 7 on Windows
          - { os: ubuntu-latest, shell: pwsh }
          - { os: macos-latest, shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: ${{ matrix.shell }}
        run: ./tests/run-tests.ps1
